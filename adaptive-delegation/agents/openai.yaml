interface:
  display_name: "Adaptive Delegation"
  short_description: "Codex-only Objective-Locked delegation"
  default_prompt: "Use $adaptive-delegation only when explicitly invoked. Install or require no hooks. Construct one portable terminal-outcome Objective Lock, select the exact package-fixed role/model/effort, and launch bounded native leaves directly. Keep every retry and escalation inside the lock, escalate only from observable evidence, use an independent Checker only when oracle shape or risk requires it, and let main own integration and final claims."
policy:
  allow_implicit_invocation: false
